<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Lectura Crítica - Ensayo Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Lora', serif;
            background-color: #fcfcfc;
            color: #333;
            line-height: 1.8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            color: #111;
        }

        .reading-section {
            margin-bottom: 60px;
        }

        .reading-text {
            font-size: 1.15rem;
            color: #444;
            margin-bottom: 30px;
            text-align: justify;
        }

        .reading-text cite {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
            text-align: right;
        }

        .image-placeholder {
            background-color: #f0f0f0;
            border: 1px dashed #ccc;
            padding: 20px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #555;
            margin: 20px 0;
            border-radius: 8px;
        }

        .question-block {
            font-family: 'Inter', sans-serif;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #eef2f5;
            border-color: #bcc6ce;
        }

        .option-btn.selected {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

            margin-top: 15px;
            font-size: 0.9rem;
